name: Visual QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/visual-qa.mjs'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-fund
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Build PR frontend
        run: npm run build
      - name: Start PR preview
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/ariadne-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ariadne-vite.log
          exit 1
      - name: Capture branch visual states
        env:
          ARIADNE_URL: http://127.0.0.1:4173
        run: node scripts/visual-qa.mjs
